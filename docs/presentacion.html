<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shareboard: pruebas de rendimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a43;--teal:#0b7782;--amber:#f2a93b;--ink:#1b2733;--mut:#56636f;--bg:#f3f6f9;--line:#d9e1ea;
--ok:#136b3f;--okbg:#e2f3e8;--bad:#b3261e;--badbg:#fbe6e3;--warnbg:#fdf1d9;
--pc:#1f6feb;--d2:#1a9e6f;--d1:#e8662f;--awu:#d99a00;--awl:#8a4fbf}
*{box-sizing:border-box;margin:0}
::selection{background:#cdeef1;color:var(--navy)}
html,body{height:100%;background:#0a1824;font-family:Inter,"Segoe UI",Calibri,Arial,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center}
.slide{position:absolute;inset:0;background:#fff;display:none;padding:40px 56px 0;overflow:hidden}
.slide.active{display:block}
.slide.dark{background:var(--navy);color:#fff}
h1{font-family:"Source Serif 4",Cambria,Georgia,serif;font-size:36px;font-weight:700;color:var(--navy);line-height:1.12;letter-spacing:-.01em;max-width:1000px;text-wrap:balance}
.dark h1{color:#fff}
.sec{position:absolute;right:56px;top:50px;font-size:12px;font-weight:600;color:var(--teal);letter-spacing:.05em;text-transform:uppercase}
.sub{font-size:16.5px;line-height:1.45;color:var(--mut);margin:8px 0 18px;max-width:1000px}
.sub b{color:var(--ink)}
.foot{position:absolute;left:56px;right:56px;bottom:0;height:36px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut);border-top:1px solid var(--line)}
.dark .foot{color:#9db4c8;border-color:#24435f}
.body{position:absolute;left:56px;right:56px;top:var(--top,150px);bottom:52px}
.row{display:flex;gap:20px}.col{display:flex;flex-direction:column;gap:14px}
.card{background:var(--bg);border-radius:12px;padding:16px 18px}
.card h3{font-size:17px;color:var(--navy);margin-bottom:6px;font-weight:700}
.card p,.card li{font-size:15px;line-height:1.45}
.card ul{padding-left:18px}.card li+li{margin-top:3px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.panel h4{font-size:15px;color:var(--navy);font-weight:700}
.panel .note{font-size:12.5px;color:var(--mut);margin:2px 0 4px}
.takeaway{font-size:15px;line-height:1.45;color:var(--ink);background:#e6f4f5;border-radius:10px;padding:10px 14px}
.takeaway b{color:var(--teal)}
table.t{table-layout:fixed;border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
.t th{background:var(--navy);color:#fff;font-weight:600;padding:8px 8px;text-align:center}
.t th:first-child{border-radius:8px 0 0 0;text-align:left;width:var(--c1,175px)}.t th:last-child{border-radius:0 8px 0 0}
.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;overflow-wrap:anywhere}
.t td:first-child{text-align:left;font-weight:600;color:var(--navy)}
.t small{display:block;font-size:12px;color:var(--mut);font-weight:500;line-height:1.25;margin-top:2px}
.t th small{color:#b9cde0;font-weight:400}
.t.mini{font-size:13px}.t.mini td{padding:4px 8px}.t.mini th{padding:5px 8px}.t.mini th small{display:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
.pill{display:inline-block;font-weight:700;padding:3px 10px;border-radius:99px;font-size:14px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--badbg);color:var(--bad)}
.chg{outline:2px solid var(--teal);outline-offset:-3px;border-radius:6px}
.shot{border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(15,42,67,.16);background:#fff;display:block}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;margin:0 0 8px}
svg{display:block}svg text{font-family:Inter,"Segoe UI",Arial,sans-serif}
.hb{display:grid;grid-template-columns:150px 1fr;align-items:center;row-gap:12px;column-gap:14px}
.hb .lab{font-weight:600;color:var(--navy);font-size:15px}.hb .lab small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.hb .track{position:relative;height:30px}
.hb .bar{height:30px;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-weight:700;font-size:14.5px;color:#fff;white-space:nowrap}
.tight .hb{row-gap:7px}.tight .hb .track,.tight .hb .bar,.tight .hb .out{height:26px}.hb.tall{row-gap:20px}.hb.tall .track,.hb.tall .bar,.hb.tall .out{height:38px}.hb.tall .bar{font-size:16px}
.t.roomy td{padding:13px 8px}.t.roomy .pill{font-size:15.5px;padding:4px 12px}.t.roomy small{font-size:12.5px}
.hb .out{position:absolute;top:0;height:30px;display:flex;align-items:center;font-size:13.5px;color:var(--mut);white-space:nowrap}
.envhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--navy);padding:12px 14px 8px}
.envhead i{width:12px;height:12px;border-radius:4px;display:inline-block}
.k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700}
.g{display:grid;grid-template-columns:118px repeat(5,1fr);column-gap:10px;row-gap:6px;align-items:center}
.gh{text-align:center;font-weight:700;font-size:14.5px;color:var(--navy)}.gh small{display:block;font-size:11.5px;color:var(--bad);font-weight:600;margin-top:3px;min-height:14px}
.gk{font-size:12.5px;font-weight:700;color:var(--navy)}.gk small{display:block;font-weight:500;color:var(--mut);font-size:11px;line-height:1.25}
.mc{text-align:center;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line);white-space:nowrap}.mc .was{color:var(--mut);font-size:12.5px}
.note2{font-size:13.5px;color:var(--mut);line-height:1.4;margin-top:6px}
@media print{
 @page{size:1280px 720px;margin:0}
 html,body{background:#fff;height:auto}
 #stage{position:static;transform:none!important;width:1280px;height:auto}
 .slide{display:block!important;position:relative;height:720px;page-break-after:always}
}
</style>

  if(endLabels){let pts=series.map(s=>{let i=s.data.length-1;while(i>=0&&s.data[i]==null)i--;return {s,y:i>=0?ty(s.data[i]):null}}).filter(p=>p.y!=null).sort((a,b)=>a.y-b.y);
    for(let i=1;i<pts.length;i++) if(pts[i].y-pts[i-1].y<15) pts[i].y=pts[i-1].y+15;
    pts.forEach(p=>g+=`<text x="${m.l+W+8}" y="${p.y+4}" font-size="12.5" font-weight="700" fill="${p.s.color}">${p.s.label}</text>`)}
  if(ytitle) g+=`<text transform="translate(13 ${m.t+H/2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#56636f">${ytitle}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${g}</svg>`;
}
const legend=items=>`<div class="legend">${items.map(([c,t,d])=>`<span><span class="dot" style="${d?'border:2px dashed '+c+';background:#fff':'background:'+c}"></span>${t}</span>`).join('')}</div>`;
function capOf(when,k){let c=0;for(const [t,u] of TESTS){const a=A(when,k,t);if(a&&a.pass===a.n)c=u;else break}return c}
function shortReason(a){
  if(a.pass===a.n) return '';
  if(a.died&&a.died.length) return `se cayó a los ${nf(Math.min(...a.died))} s`;
  const r=(a.reasons[0]||'').replace(/\s*\(.*$/,'');let m;
  if((m=r.match(/errores ([\d.]+)/))) return `${Math.min(100,+m[1]).toLocaleString('es-CO',{maximumFractionDigits:0})} % de errores`;
  if((m=r.match(/p99 ping ([\d.]+)/))) return `ping p99 ${nf(+m[1])} ms`;
  if((m=r.match(/p95 REST ([\d.]+)/))) return `REST p95 ${nf(+m[1])} ms`;
  if((m=r.match(/p95 difusi[oó]n ([\d.]+)/))) return `trazo p95 ${nf(+m[1])} ms`;
  return r.replace(/(\d)\.(\d)/g,'$1,$2');
}

  const msf=v=>ms(v)+(v>=15000?'':' ms');

}

const slides=[...stage.children];
let cur=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===cur));history.replaceState(null,'','#'+(cur+1))}
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',fit);fit();show(cur);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))show(cur+1);else if(['ArrowLeft','PageUp'].includes(e.key))show(cur-1);else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);else if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()});
stage.addEventListener('click',e=>show(e.clientX>innerWidth/2?cur+1:cur-1));
